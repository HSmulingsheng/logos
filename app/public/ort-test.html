<!doctype html><meta charset="utf-8"><title>ORT WASM 速度测试</title>
<body><pre id="out">加载中…</pre>
<script type="module">
const out = document.getElementById('out')
const log = (s) => { out.textContent += s + '\n' }
try {
  const ort = await import('/ort/ort.wasm.bundle.min.mjs')
  ort.env.wasm.wasmPaths = '/ort/'
  ort.env.wasm.numThreads = 1
  ort.env.logLevel = 'error'
  log('ORT 已载入')
  const t0 = performance.now()
  const sess = await ort.InferenceSession.create('/mms-grc/onnx/model.onnx', { executionProviders: ['wasm'] })
  log(`模型加载 ${((performance.now()-t0)/1000).toFixed(1)}s`)
  const vocab = await (await fetch('/mms-grc/vocab.json')).json()
  const tok = (text) => {
    const s = text.toLowerCase().replace(/ς/g, 'σ')
    const ids = [0]
    for (const ch of s) { const id = vocab[ch]; if (id !== undefined) { ids.push(id, 0) } }
    return ids
  }
  const text = 'Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν.'
  const ids = tok(text)
  log('token 数 ' + ids.length)
  for (let i = 0; i < 3; i++) {
    const t = performance.now()
    const feeds = {
      input_ids: new ort.Tensor('int64', BigInt64Array.from(ids.map(BigInt)), [1, ids.length]),
      attention_mask: new ort.Tensor('int64', BigInt64Array.from(ids.map(() => 1n)), [1, ids.length]),
    }
    const res = await sess.run(feeds)
    const wav = res.waveform.data
    const secs = wav.length / 16000
    let peak = 0, sum = 0
    for (let k = 0; k < wav.length; k++) { const v = Math.abs(wav[k]); if (v > peak) peak = v; sum += v }
    log(`第 ${i+1} 次: ${((performance.now()-t)/1000).toFixed(2)}s 推理 → 音频 ${secs.toFixed(2)}s | 峰值 ${peak.toFixed(3)} 均值 ${(sum/wav.length).toFixed(4)}`)
  }
  log('DONE')
} catch (e) { log('错误: ' + (e && e.message || e)) }
</script>
